# Aplicación web de una tienda con su base de datos (resultado típico de `kustomize build`).
apiVersion: v1
kind: Namespace
metadata:
  name: tienda
  labels:
    environment: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: tienda
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solo-desde-api
  namespace: tienda
spec:
  podSelector:
    matchLabels:
      app: postgres
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx
  namespace: tienda
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        root /usr/share/nginx/html;
      }
      location /api/ {
        proxy_pass http://api:8080/;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: tienda
data:
  LOG_LEVEL: info
  CACHE_URL: redis://redis:6379/0
  PAYMENTS_URL: https://pagos.example.com/v2
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: tienda
type: Opaque
data:
  username: YXBwX3VzZXI=
  password: UzNjcjN0LWs4cy1kby1ub3QtbGVhayE=
stringData:
  connection-string: postgresql://app_user:K8s-S3cr3t-do-not-leak!@postgres:5432/tienda
---
apiVersion: v1
kind: Secret
metadata:
  name: tienda-tls
  namespace: tienda
type: kubernetes.io/tls
data:
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: tienda
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tienda
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15.4
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tienda
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tienda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tienda
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tienda
  labels:
    app: api
    team: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      containers:
        - name: api
          image: registry.example.com/tienda/api:2.4.1
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgresql://app_user@postgres.tienda.svc.cluster.local:5432/tienda
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          envFrom:
            - configMapRef:
                name: api-config
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tienda
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: tienda
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: tienda
  labels:
    app: web
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: registry.example.com/tienda/web:2.4.1
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-conf
          configMap:
            name: web-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: tienda
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: limpieza-carritos
  namespace: tienda
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: limpieza
              image: curlimages/curl:8.5.0
              args: ["-fsS", "-X", "POST", "http://api.tienda.svc.cluster.local:8080/internal/limpiar-carritos"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tienda
  namespace: tienda
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  tls:
    - hosts: [tienda.example.com]
      secretName: tienda-tls
  rules:
    - host: tienda.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tienda
  namespace: tienda
spec:
  secretName: tienda-tls
  dnsNames: [tienda.example.com]
  issuerRef:
    name: letsencrypt
