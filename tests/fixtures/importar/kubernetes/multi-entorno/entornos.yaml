# El mismo servicio en dos namespaces que son entornos distintos.
apiVersion: v1
kind: Namespace
metadata:
  name: staging
---
apiVersion: v1
kind: Namespace
metadata:
  name: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogo
  template:
    metadata:
      labels:
        app: catalogo
    spec:
      containers:
        - name: catalogo
          image: registry.example.com/catalogo:3.1.0-rc2
          ports:
            - containerPort: 8000
          env:
            - name: BROKER_URL
              value: amqp://rabbitmq.staging.svc:5672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo
  namespace: production
spec:
  replicas: 4
  selector:
    matchLabels:
      app: catalogo
  template:
    metadata:
      labels:
        app: catalogo
    spec:
      containers:
        - name: catalogo
          image: registry.example.com/catalogo:3.0.2
          ports:
            - containerPort: 8000
          env:
            - name: BROKER_URL
              value: amqp://rabbitmq.production.svc:5672
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: staging
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.12-management
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: production
spec:
  serviceName: rabbitmq
  replicas: 3
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.12-management
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: staging
spec:
  selector:
    app: rabbitmq
  ports:
    - port: 5672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: production
spec:
  selector:
    app: rabbitmq
  ports:
    - port: 5672
