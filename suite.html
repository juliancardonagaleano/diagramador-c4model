<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IArk - DIAgrams · Suite</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23175e7a'/%3E%3Ctext x='16' y='22' font-family='Inter,Arial' font-size='16' font-weight='700' text-anchor='middle' fill='white'%3EIA%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="sh">
      <header class="sh-header">
        <a class="wb-brand" href="./">IArk - DIAgrams <small>Suite</small></a>
        <form id="manifest-form" aria-label="Instancia">
          <label class="wb-visually-hidden" for="manifest-url">Manifiesto de la instancia</label>
          <input id="manifest-url" type="text" spellcheck="false" />
          <button type="submit" class="primary">Conectar</button>
        </form>
        <span class="wb-chip info" id="state" role="status">conectando…</span>
      </header>
      <div class="sh-body">
        <nav class="sh-nav" id="modules" aria-label="Módulos"></nav>
        <main class="sh-stage" id="stage"></main>
        <aside class="sh-side">
          <div class="sh-info" id="info"></div>
          <div class="wb-bar"><strong>Eventos recibidos por postMessage</strong></div>
          <div class="sh-log" id="log"></div>
        </aside>
      </div>
    </div>
    <script type="module" src="/src/shell/main.ts"></script>
  </body>
</html>
